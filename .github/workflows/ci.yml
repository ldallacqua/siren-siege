name: CI

# Full gate on pull requests and on every branch except main (main runs deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke test (desktop, phone portrait, phone landscape)
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: artifacts/smoke/
          if-no-files-found: ignore
