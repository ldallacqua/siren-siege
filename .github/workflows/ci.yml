name: CI

# Gate on pull requests and on every branch except main (main runs deploy.yml).
on:
  pull_request:
  push:
    # Dependabot branches are covered by their pull_request run.
    branches-ignore: [main, gh-pages, 'dependabot/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Pushes already ran the smoke test in .githooks/pre-push; pull requests (Dependabot,
      # contributors) haven't, so they get it here.
      - name: Smoke test (desktop, phone portrait, phone landscape)
        if: github.event_name == 'pull_request'
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: smoke-screenshots
          path: artifacts/smoke/
          if-no-files-found: ignore
